name: CI - Movie Virtual Knowledge Graph

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Check Ruff linting
        run: uv run ruff check .

  security-checks:
    name: Security & Secret Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure .env is not committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "ERROR: Real .env file was tracked by git!"
            exit 1
          fi
          echo "Verified: .env is not tracked in git."

      - name: Ensure no private keys tracked
        run: |
          if git ls-files '*.key' '*.pem' '*.secret' | grep .; then
            echo "ERROR: Secret files detected in git!"
            exit 1
          fi
          echo "Verified: No secret files tracked."

  tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: movies_db
          POSTGRES_USER: movie_admin
          POSTGRES_PASSWORD: dev_movie_master_secret_password_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Seed Database Schema and Metadata
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=dev_movie_master_secret_password_2026 psql -h localhost -U movie_admin -d movies_db -f movie-metadata-db/sql/001_create_schema.sql
          PGPASSWORD=dev_movie_master_secret_password_2026 psql -h localhost -U movie_admin -d movies_db -f movie-metadata-db/sql/002_seed_metadata.sql
          PGPASSWORD=dev_movie_master_secret_password_2026 psql -h localhost -U movie_admin -d movies_db -f movie-metadata-db/sql/003_seed_movies.sql
          PGPASSWORD=dev_movie_master_secret_password_2026 psql -h localhost -U movie_admin -d movies_db -f movie-metadata-db/sql/004_create_views.sql
          PGPASSWORD=dev_movie_master_secret_password_2026 psql -h localhost -U movie_admin -d movies_db -f scripts/setup_readonly_user.sql

      - name: Inspect Schema
        run: uv run python scripts/inspect_schema.py --include-row-counts

      - name: Run Pytest Test Suite
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_DB: movies_db
          POSTGRES_USER: ontop_ro
          POSTGRES_PASSWORD: dev_ontop_ro_secret_password_2026
          ONTOP_ENDPOINT_URL: http://127.0.0.1:8080/sparql
          API_KEY: dev_movie_vkg_secret_api_key_2026
        run: |
          uv run pytest tests/unit tests/integration/test_safety_and_preservation.py --cov=app --cov-report=term-missing --cov-fail-under=60
