services:
  postgres:
    image: postgres:16.4-alpine
    container_name: movie-metadata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-movies_db}
      POSTGRES_USER: ${POSTGRES_USER:-movie_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_movie_master_secret_password_2026}
      TZ: ${TZ:-UTC}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-movie_admin} -d ${POSTGRES_DB:-movies_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - movie_network

  metabase:
    image: metabase/metabase:v0.50.23
    container_name: movie-metadata-metabase
    restart: unless-stopped
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_JETTY_PORT: 3000
      TZ: ${TZ:-UTC}
    ports:
      - "${METABASE_PORT:-3000}:3000"
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - movie_network

volumes:
  postgres_data:
    driver: local
    name: movie_metadata_postgres_data
  metabase_data:
    driver: local
    name: movie_metadata_metabase_data

networks:
  movie_network:
    driver: bridge
    name: movie_metadata_network
