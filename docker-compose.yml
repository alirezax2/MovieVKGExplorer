# ==============================================================================
# Docker Compose: Movie VKG Full Stack (PostgreSQL, Metabase, Ontop, FastAPI)
# ==============================================================================
# Preserves existing PostgreSQL and Metabase containers, volumes, and network.
# Adds Ontop VKG and FastAPI semantic query engine.
# ==============================================================================

services:
  postgres:
    build:
      context: ./movie-metadata-db
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-movies_db}
      POSTGRES_USER: ${POSTGRES_USER:-movie_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_movie_master_secret_password_2026}
      PGPORT: 5425
      TZ: ${TZ:-UTC}
    ports:
      - "${POSTGRES_PORT:-5425}:5425"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -p 5425 -U ${POSTGRES_USER:-movie_admin} -d ${POSTGRES_DB:-movies_db}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - movie_network

  metabase:
    image: metabase/metabase:v0.50.23
    restart: unless-stopped
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_JETTY_PORT: 3000
      TZ: ${TZ:-UTC}
    ports:
      - "${METABASE_PORT:-3000}:3000"
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000/api/health || wget -q --spider http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - movie_network

  ontop:
    build:
      context: ./ontop
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${ONTOP_PORT:-8825}:8080"
    environment:
      ONTOP_ONTOLOGY_FILE: /opt/ontop/input/ontology.ttl
      ONTOP_MAPPING_FILE: /opt/ontop/input/mapping.obda
      ONTOP_PROPERTIES_FILE: /opt/ontop/input/ontop.properties
      ONTOP_DB_URL: jdbc:postgresql://postgres:5425/${POSTGRES_DB:-movies_db}
      ONTOP_DB_USER: ${ONTOP_DB_USER:-ontop_ro}
      ONTOP_DB_PASSWORD: ${ONTOP_DB_PASSWORD:-dev_ontop_ro_secret_password_2026}
      ONTOP_DISABLE_PORTAL_PAGE: "true"
      ONTOP_WAIT_FOR: postgres:5425
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "nc", "-z", "127.0.0.1", "8080" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks:
      - movie_network

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FASTAPI_PORT:-8025}:8025"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5425
      POSTGRES_DB: ${POSTGRES_DB:-movies_db}
      POSTGRES_USER: ${ONTOP_DB_USER:-ontop_ro}
      POSTGRES_PASSWORD: ${ONTOP_DB_PASSWORD:-dev_ontop_ro_secret_password_2026}
      ONTOP_ENDPOINT_URL: http://ontop:8080/sparql
      VKG_BASE_IRI: ${VKG_BASE_IRI:-https://example.org/movie-vkg/}
      OMNIROUTE_BASE_URL: ${OMNIROUTE_BASE_URL:-https://omniroute.alphigma.com/v1}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY}
      OMNIROUTE_MODEL: ${OMNIROUTE_MODEL:-no-think/antigravity/claude-sonnet-4-6}
      API_KEY: ${API_KEY:-dev_movie_vkg_secret_api_key_2026}
      FASTAPI_PORT: 8025
      ENVIRONMENT: production
    depends_on:
      ontop:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8025/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - movie_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5125:5125"
    environment:
      - VITE_API_URL=http://localhost:8025
    depends_on:
      fastapi:
        condition: service_started
    networks:
      - movie_network

volumes:
  postgres_data:
    name: movie_metadata_postgres_data
  metabase_data:
    name: movie_metadata_metabase_data

networks:
  movie_network:
    name: movie_metadata_network
